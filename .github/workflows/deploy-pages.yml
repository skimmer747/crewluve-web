name: Deploy to GitHub Pages

# Tests and builds on every push to main, then publishes dist/ to Pages
# (custom domain crewluve.crewlu.net). Same pattern as crewlu-globe.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only by default. Only the deploy job, which runs no project code, may publish to Pages.
permissions:
  contents: read

# Never cancel an in-progress production deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Named rather than ubuntu-latest, so a new Ubuntu arrives on purpose, in a deploy someone watches.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # What /join sends invite links to is the built page: join.html for /join, and 404.html for the other unknown paths,
      # both exact copies of index.html, with the Safari banner tag and the CSP. A deploy without them fails here.
      - run: |
          cmp dist/index.html dist/join.html
          cmp dist/index.html dist/404.html
          grep -q 'name="apple-itunes-app"' dist/join.html
          grep -q 'http-equiv="Content-Security-Policy"' dist/join.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          # Publish dot-folders too: iPhones read the app-link file from /.well-known/ (partner links piece 1b).
          # The only dot-folder in CI's dist/ is the tracked public/.well-known; Vite writes none, and .DS_Store is git-ignored.
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    # GitHub Pages often fails the first deploy with "Deployment failed, try again later"
    # and succeeds on a retry (seen on crewlu-globe), so try up to 3 times.
    steps:
      - id: a1
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - id: a2
        if: steps.a1.outcome != 'success'
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - id: a3
        if: steps.a1.outcome != 'success' && steps.a2.outcome != 'success'
        uses: actions/deploy-pages@v5
